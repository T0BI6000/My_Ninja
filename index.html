<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Casino Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #020408;
            --bg-console: #080d14;
            --bg-input: #050a10;
            --bg-message: #0a1120;
            --border-primary: #1a2740;
            --border-glow: rgba(74, 222, 128, 0.2);
            --text-muted: #3d5470;
            --text-normal: #8ba5c4;
            --glow-green: #4ade80;
            --glow-blue: #38bdf8;
            --glow-orange: #fb923c;
            --glow-red: #f87171;
            --glow-purple: #c084fc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            color: var(--text-normal);
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(74, 222, 128, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(56, 189, 248, 0.03) 0%, transparent 50%);
        }

        /* Scanline overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.15) 2px,
                rgba(0, 0, 0, 0.15) 4px
            );
            pointer-events: none;
            z-index: 9999;
        }

        .console-wrapper {
            width: 95%;
            max-width: 700px;
            background-color: var(--bg-console);
            border: 1px solid var(--border-primary);
            border-radius: 12px;
            box-shadow:
                0 0 0 1px rgba(74, 222, 128, 0.05),
                0 0 40px rgba(0, 0, 0, 0.8),
                0 0 80px rgba(74, 222, 128, 0.05),
                inset 0 1px 0 rgba(255,255,255,0.03);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Header */
        .header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-primary);
            background: linear-gradient(135deg, #0d1520 0%, #080d14 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(74,222,128,0.3), transparent);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(74,222,128,0.15), rgba(74,222,128,0.05));
            border: 1px solid rgba(74,222,128,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .header-title h2 {
            font-family: 'Orbitron', monospace;
            color: var(--glow-green);
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(74,222,128,0.5);
        }

        .header-title p {
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--glow-green);
            box-shadow: 0 0 8px var(--glow-green);
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        /* Chat box */
        #chat-box {
            height: 460px;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        #chat-box::-webkit-scrollbar { width: 4px; }
        #chat-box::-webkit-scrollbar-track { background: transparent; }
        #chat-box::-webkit-scrollbar-thumb { background: var(--border-primary); border-radius: 4px; }

        /* Messages */
        .msg-block {
            display: flex;
            flex-direction: column;
            gap: 6px;
            animation: fadeSlideIn 0.3s ease forwards;
        }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-meta {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .msg-avatar {
            font-size: 0.72rem;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .timestamp {
            font-size: 0.68rem;
            color: var(--text-muted);
        }

        .msg-bubble {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.88rem;
            line-height: 1.6;
            max-width: 90%;
            position: relative;
            word-break: break-word;
        }

        /* Bot messages */
        .bot-msg .msg-avatar {
            color: var(--glow-orange);
            background: rgba(251,146,60,0.08);
            border: 1px solid rgba(251,146,60,0.15);
        }

        .bot-msg .msg-bubble {
            background: linear-gradient(135deg, rgba(251,146,60,0.05), rgba(10,17,32,0.8));
            border: 1px solid rgba(251,146,60,0.1);
            border-left: 2px solid rgba(251,146,60,0.4);
            color: #e2e8f0;
            align-self: flex-start;
        }

        /* User messages */
        .user-msg {
            align-items: flex-end;
        }

        .user-msg .msg-meta {
            flex-direction: row-reverse;
        }

        .user-msg .msg-avatar {
            color: var(--glow-blue);
            background: rgba(56,189,248,0.08);
            border: 1px solid rgba(56,189,248,0.15);
        }

        .user-msg .msg-bubble {
            background: linear-gradient(135deg, rgba(56,189,248,0.08), rgba(10,17,32,0.8));
            border: 1px solid rgba(56,189,248,0.12);
            border-right: 2px solid rgba(56,189,248,0.4);
            color: var(--glow-blue);
            align-self: flex-end;
        }

        /* System alert message */
        .alert-msg .msg-avatar {
            color: var(--glow-green);
            background: rgba(74,222,128,0.08);
            border: 1px solid rgba(74,222,128,0.2);
        }

        .alert-msg .msg-bubble {
            background: linear-gradient(135deg, rgba(74,222,128,0.08), rgba(10,17,32,0.9));
            border: 1px solid rgba(74,222,128,0.2);
            border-left: 2px solid var(--glow-green);
            color: var(--glow-green);
            text-shadow: 0 0 10px rgba(74,222,128,0.3);
        }

        /* Typing indicator */
        #typing-indicator .msg-bubble {
            padding: 14px 18px;
        }

        .typing-dots {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            background: var(--glow-orange);
            border-radius: 50%;
            animation: bounce 1.2s infinite ease-in-out;
            box-shadow: 0 0 6px var(--glow-orange);
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-5px); opacity: 1; }
        }

        /* Typewriter cursor */
        .typewriter-text::after {
            content: '▋';
            animation: blink 0.7s step-end infinite;
            color: var(--glow-orange);
            font-size: 0.8em;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Divider */
        .chat-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 4px;
        }

        .chat-divider span {
            font-size: 0.65rem;
            color: var(--text-muted);
            white-space: nowrap;
            letter-spacing: 1px;
        }

        .chat-divider::before,
        .chat-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-primary));
        }

        .chat-divider::after {
            background: linear-gradient(90deg, var(--border-primary), transparent);
        }

        /* Input area */
        .input-area {
            padding: 16px 20px;
            background: var(--bg-input);
            border-top: 1px solid var(--border-primary);
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .input-area::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(74,222,128,0.2), transparent);
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            padding: 10px 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: rgba(74,222,128,0.3);
            box-shadow: 0 0 0 3px rgba(74,222,128,0.05);
        }

        .prompt-symbol {
            color: var(--glow-green);
            font-size: 1rem;
            flex-shrink: 0;
            opacity: 0.7;
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--glow-green);
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            outline: none;
            caret-color: var(--glow-green);
        }

        input::placeholder { color: var(--text-muted); }
        input:disabled { opacity: 0.4; }

        button#send-btn {
            background: linear-gradient(135deg, rgba(74,222,128,0.15), rgba(74,222,128,0.08));
            color: var(--glow-green);
            border: 1px solid rgba(74,222,128,0.25);
            padding: 10px 20px;
            font-family: 'Orbitron', monospace;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 8px;
            transition: all 0.2s;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        button#send-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, rgba(74,222,128,0.25), rgba(74,222,128,0.12));
            border-color: rgba(74,222,128,0.5);
            box-shadow: 0 0 16px rgba(74,222,128,0.15);
            transform: translateY(-1px);
        }

        button#send-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        /* Status bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px;
            background: #030608;
            border-top: 1px solid rgba(26,39,64,0.5);
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .status-item .val {
            color: var(--glow-green);
            font-weight: bold;
        }

        .status-item .val.warning { color: var(--glow-orange); }

        /* Corner decorations */
        .corner {
            position: absolute;
            width: 10px;
            height: 10px;
            border-color: rgba(74,222,128,0.3);
            border-style: solid;
        }

        .corner-tl { top: 8px; left: 8px; border-width: 1px 0 0 1px; }
        .corner-tr { top: 8px; right: 8px; border-width: 1px 1px 0 0; }
        .corner-bl { bottom: 8px; left: 8px; border-width: 0 0 1px 1px; }
        .corner-br { bottom: 8px; right: 8px; border-width: 0 1px 1px 0; }
    </style>
</head>
<body>
    <div class="console-wrapper">
        <!-- Corner decorations -->
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <div class="header-icon">🎰</div>
                <div class="header-title">
                    <h2>Security Channel</h2>
                    <p>ENCRYPTED CONNECTION ESTABLISHED</p>
                </div>
            </div>
            <div class="header-status">
                <div class="status-dot"></div>
                ONLINE
            </div>
        </div>

        <!-- Chat box -->
        <div id="chat-box">
            <div class="chat-divider"><span>SESSION START</span></div>
            <div class="msg-block bot-msg">
                <div class="msg-meta">
                    <div class="msg-avatar">[GUARD]</div>
                    <div class="timestamp" id="init-time"></div>
                </div>
                <div class="msg-bubble">
                    State your business. We only do high-stakes gambling here.
                </div>
            </div>
        </div>

        <!-- Input -->
        <div class="input-area">
            <div class="input-wrapper">
                <span class="prompt-symbol">›</span>
                <input type="text" id="user-input" placeholder="Enter your message..." autocomplete="off" onkeypress="handleKeyPress(event)">
            </div>
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>

        <!-- Status bar -->
        <div class="status-bar">
            <div class="status-item">CONN <span class="val">[CASINO_VIP_GW]</span></div>
            <div class="status-item">ENCR <span class="val">AES-256</span></div>
            <div class="status-item">PING <span class="val" id="latency">—</span></div>
            <div class="status-item">MSG <span class="val" id="msg-count">1</span></div>
        </div>
    </div>

    <script>
        let msgCount = 1;
        document.getElementById('init-time').innerText = getTimestamp();

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function getTimestamp() {
            const n = new Date();
            return `${n.getHours().toString().padStart(2,'0')}:${n.getMinutes().toString().padStart(2,'0')}:${n.getSeconds().toString().padStart(2,'0')}`;
        }

        function setLocked(locked) {
            document.getElementById('user-input').disabled = locked;
            document.getElementById('send-btn').disabled = locked;
        }

        function showTyping() {
            const chatBox = document.getElementById('chat-box');
            const el = document.createElement('div');
            el.id = 'typing-indicator';
            el.className = 'msg-block bot-msg';
            el.innerHTML = `
                <div class="msg-meta">
                    <div class="msg-avatar">[GUARD]</div>
                    <div class="timestamp">${getTimestamp()}</div>
                </div>
                <div class="msg-bubble">
                    <div class="typing-dots"><span></span><span></span><span></span></div>
                </div>`;
            chatBox.appendChild(el);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('typing-indicator');
            if (el) el.remove();
        }

        function typewrite(el, text, speed = 18) {
            return new Promise(resolve => {
                el.classList.add('typewriter-text');
                let i = 0;
                const iv = setInterval(() => {
                    el.textContent += text[i++];
                    if (i >= text.length) {
                        clearInterval(iv);
                        el.classList.remove('typewriter-text');
                        resolve();
                    }
                }, speed);
            });
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (!message) return;

            const chatBox = document.getElementById('chat-box');
            msgCount++;
            document.getElementById('msg-count').textContent = msgCount;

            // User bubble
            const userBlock = document.createElement('div');
            userBlock.className = 'msg-block user-msg';
            userBlock.innerHTML = `
                <div class="msg-meta">
                    <div class="msg-avatar">[YOU]</div>
                    <div class="timestamp">${getTimestamp()}</div>
                </div>
                <div class="msg-bubble">${message}</div>`;
            chatBox.appendChild(userBlock);
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
            setLocked(true);

            showTyping();
            const start = Date.now();

            try {
                const res = await fetch('http://127.0.0.1:5000/app', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const data = await res.json();
                const ping = Date.now() - start;
                document.getElementById('latency').textContent = `${ping}ms`;

                // Min delay for realism
                if (ping < 900) await new Promise(r => setTimeout(r, 900 - ping));

                removeTyping();
                msgCount++;
                document.getElementById('msg-count').textContent = msgCount;

                let text = data.reply;
                let isAlert = false;

                if (text.includes('[SYSTEM ALERT]:')) {
                    isAlert = true;
                    text = text.replace('[SYSTEM ALERT]: ', '');
                } else {
                    text = text.replace('[Guard]: ', '');
                }

                const botBlock = document.createElement('div');
                botBlock.className = `msg-block ${isAlert ? 'alert-msg' : 'bot-msg'}`;

                const bubble = document.createElement('div');
                bubble.className = 'msg-bubble';

                botBlock.innerHTML = `
                    <div class="msg-meta">
                        <div class="msg-avatar">${isAlert ? '[SYS]' : '[GUARD]'}</div>
                        <div class="timestamp">${getTimestamp()}</div>
                    </div>`;
                botBlock.appendChild(bubble);
                chatBox.appendChild(botBlock);
                chatBox.scrollTop = chatBox.scrollHeight;

                await typewrite(bubble, text, isAlert ? 22 : 16);

            } catch (err) {
                removeTyping();
                const errBlock = document.createElement('div');
                errBlock.className = 'msg-block';
                errBlock.innerHTML = `
                    <div class="msg-meta">
                        <div class="msg-avatar" style="color:var(--glow-red);background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.15)">[ERR]</div>
                        <div class="timestamp">${getTimestamp()}</div>
                    </div>
                    <div class="msg-bubble" style="border-left-color:var(--glow-red);color:var(--glow-red)">CONNECTION ERROR. API UNREACHABLE.</div>`;
                chatBox.appendChild(errBlock);
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            setLocked(false);
            document.getElementById('user-input').focus();
        }
    </script>
</body>
</html>
